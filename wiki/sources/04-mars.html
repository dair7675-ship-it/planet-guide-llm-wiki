<!doctype html><html lang="zh-Hant"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><meta name="theme-color" content="#f9f9f5"><link rel="stylesheet" href="../../style.css"><title>來源 S04｜火星</title></head><body><main class="wrap"><div class="top"><a class="logo" href="../../">✦ PLANET GUIDE</a><a class="navlink" href="../">返回 Wiki 首頁</a></div><div class="read"><div class="eyebrow">資料來源 · S04</div><h1>來源：火星</h1><p>NASA Science — Mars Facts</p><div class="panel"><p><b>已納入的重點：</b>火星被稱為紅色行星，表面偏紅與含鐵礦物的氧化有關。</p><p>火星是寒冷、乾燥且大氣稀薄的岩石行星，有兩顆小衛星：火衛一與火衛二。</p><p><b>交叉檢查：</b>火星曾有較多液態水的證據，不代表現在表面有像地球一樣的海洋。</p></div><h2>來源對照</h2><p class="sourcebox"><a href="https://science.nasa.gov/mars/facts/" target="_blank" rel="noopener">https://science.nasa.gov/mars/facts/</a></p><p><a href="../concepts/mars.html">前往對應的 Wiki 概念頁</a></p><p><a href="../../raw/04-mars.md">查看原始中文整理筆記</a></p></div></main></body></html>
