<!doctype html><html lang="zh-Hant"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><meta name="theme-color" content="#f9f9f5"><link rel="stylesheet" href="../../style.css"><title>來源 S03｜地球</title></head><body><main class="wrap"><div class="top"><a class="logo" href="../../">✦ PLANET GUIDE</a><a class="navlink" href="../">返回 Wiki 首頁</a></div><div class="read"><div class="eyebrow">資料來源 · S03</div><h1>來源：地球</h1><p>NASA Science — Earth Facts</p><div class="panel"><p><b>已納入的重點：</b>地球是我們的家園，也是目前唯一已確認有生命的行星。</p><p>地球有穩定存在於表面的液態水，繞太陽公轉一圈約 365.25 天，有一顆天然衛星。</p><p><b>交叉檢查：</b>「目前只確認地球有生命」不等於斷言其他行星絕不可能有生命。</p></div><h2>來源對照</h2><p class="sourcebox"><a href="https://science.nasa.gov/earth/facts/" target="_blank" rel="noopener">https://science.nasa.gov/earth/facts/</a></p><p><a href="../concepts/earth.html">前往對應的 Wiki 概念頁</a></p><p><a href="../../raw/03-earth.md">查看原始中文整理筆記</a></p></div></main></body></html>
