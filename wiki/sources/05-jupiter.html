<!doctype html><html lang="zh-Hant"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><meta name="theme-color" content="#f9f9f5"><link rel="stylesheet" href="../../style.css"><title>來源 S05｜木星</title></head><body><main class="wrap"><div class="top"><a class="logo" href="../../">✦ PLANET GUIDE</a><a class="navlink" href="../">返回 Wiki 首頁</a></div><div class="read"><div class="eyebrow">資料來源 · S05</div><h1>來源：木星</h1><p>NASA Science — Jupiter Facts</p><div class="panel"><p><b>已納入的重點：</b>木星是太陽系最大的行星。</p><p>木星主要由氫和氦組成，沒有像地球那樣可以站立的真正固體表面；大紅斑是一個大型風暴。</p><p><b>交叉檢查：</b>木星並非表面鋪滿陸地的大型地球，而是氣體巨行星。</p></div><h2>來源對照</h2><p class="sourcebox"><a href="https://science.nasa.gov/jupiter/jupiter-facts/" target="_blank" rel="noopener">https://science.nasa.gov/jupiter/jupiter-facts/</a></p><p><a href="../concepts/jupiter.html">前往對應的 Wiki 概念頁</a></p><p><a href="../../raw/05-jupiter.md">查看原始中文整理筆記</a></p></div></main></body></html>
