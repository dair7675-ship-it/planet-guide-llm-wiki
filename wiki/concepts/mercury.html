<!doctype html><html lang="zh-Hant"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><meta name="theme-color" content="#f9f9f5"><link rel="stylesheet" href="../../style.css"><title>水星｜星球小百科 Wiki</title></head><body><main class="wrap"><div class="top"><a class="logo" href="../../">✦ PLANET GUIDE</a><a class="navlink" href="../">返回 Wiki 首頁</a></div><article class="read"><div class="eyebrow">概念頁 · S01</div><h1>水星 <span class="small">MERCURY</span></h1><div class="planet" style="--color:#75a2bc;--light:#a3d2e6"></div><p style="font-size:1.2rem">離太陽最近，也是八大行星中最小的一顆。</p><h2>認識更多</h2><p>水星公轉一圈約需 88 個地球日；沒有天然衛星。</p><h2>記住這四件事</h2><ul><li>太陽系第 1 顆行星</li><li>八大行星中最小的一顆</li><li>公轉一圈約 88 個地球日</li><li>沒有天然衛星</li></ul><h2>容易混淆的地方</h2><p>離太陽最近不代表表面最熱，金星因濃厚大氣與溫室效應更熱。</p><div class="panel"><b>來源與追溯</b><p><a href="../sources/01-mercury.html">Wiki 來源條目 S01</a> · <a href="https://science.nasa.gov/mercury/facts/" target="_blank" rel="noopener">NASA Science 原始資料</a></p></div></article><footer>此頁由 NASA 來源整理為中文入門摘要，非 NASA 官方翻譯。</footer></main></body></html>
