<!doctype html><html lang="zh-Hant"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><meta name="theme-color" content="#f9f9f5"><link rel="stylesheet" href="../../style.css"><title>火星｜星球小百科 Wiki</title></head><body><main class="wrap"><div class="top"><a class="logo" href="../../">✦ PLANET GUIDE</a><a class="navlink" href="../">返回 Wiki 首頁</a></div><article class="read"><div class="eyebrow">概念頁 · S04</div><h1>火星 <span class="small">MARS</span></h1><div class="planet" style="--color:#d88878;--light:#f5b4a4"></div><p style="font-size:1.2rem">火星被稱為紅色行星，表面偏紅與含鐵礦物的氧化有關。</p><h2>認識更多</h2><p>火星是寒冷、乾燥且大氣稀薄的岩石行星，有兩顆小衛星：火衛一與火衛二。</p><h2>記住這四件事</h2><ul><li>太陽系第 4 顆行星</li><li>表面偏紅與鐵的氧化有關</li><li>寒冷且大氣稀薄</li><li>有兩顆小衛星</li></ul><h2>容易混淆的地方</h2><p>火星曾有較多液態水的證據，不代表現在表面有像地球一樣的海洋。</p><div class="panel"><b>來源與追溯</b><p><a href="../sources/04-mars.html">Wiki 來源條目 S04</a> · <a href="https://science.nasa.gov/mars/facts/" target="_blank" rel="noopener">NASA Science 原始資料</a></p></div></article><footer>此頁由 NASA 來源整理為中文入門摘要，非 NASA 官方翻譯。</footer></main></body></html>
