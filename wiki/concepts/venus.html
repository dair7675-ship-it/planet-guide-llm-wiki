<!doctype html><html lang="zh-Hant"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><meta name="theme-color" content="#f9f9f5"><link rel="stylesheet" href="../../style.css"><title>金星｜星球小百科 Wiki</title></head><body><main class="wrap"><div class="top"><a class="logo" href="../../">✦ PLANET GUIDE</a><a class="navlink" href="../">返回 Wiki 首頁</a></div><article class="read"><div class="eyebrow">概念頁 · S02</div><h1>金星 <span class="small">VENUS</span></h1><div class="planet" style="--color:#ebbb78;--light:#ffdfa6"></div><p style="font-size:1.2rem">金星是太陽系表面最熱的行星。</p><h2>認識更多</h2><p>濃厚大氣會留住熱量，形成很強的溫室效應；金星與地球大小相近。</p><h2>記住這四件事</h2><ul><li>太陽系第 2 顆行星</li><li>表面溫度非常高</li><li>濃厚大氣造成強烈溫室效應</li><li>大小與地球相近</li></ul><h2>容易混淆的地方</h2><p>最熱的是金星，不是離太陽最近的水星。</p><div class="panel"><b>來源與追溯</b><p><a href="../sources/02-venus.html">Wiki 來源條目 S02</a> · <a href="https://science.nasa.gov/venus/venus-facts/" target="_blank" rel="noopener">NASA Science 原始資料</a></p></div></article><footer>此頁由 NASA 來源整理為中文入門摘要，非 NASA 官方翻譯。</footer></main></body></html>
