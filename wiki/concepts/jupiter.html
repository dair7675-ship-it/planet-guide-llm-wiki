<!doctype html><html lang="zh-Hant"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><meta name="theme-color" content="#f9f9f5"><link rel="stylesheet" href="../../style.css"><title>木星｜星球小百科 Wiki</title></head><body><main class="wrap"><div class="top"><a class="logo" href="../../">✦ PLANET GUIDE</a><a class="navlink" href="../">返回 Wiki 首頁</a></div><article class="read"><div class="eyebrow">概念頁 · S05</div><h1>木星 <span class="small">JUPITER</span></h1><div class="planet" style="--color:#cba983;--light:#efcdab"></div><p style="font-size:1.2rem">木星是太陽系最大的行星。</p><h2>認識更多</h2><p>木星主要由氫和氦組成，沒有像地球那樣可以站立的真正固體表面；大紅斑是一個大型風暴。</p><h2>記住這四件事</h2><ul><li>太陽系第 5 顆行星</li><li>太陽系最大的行星</li><li>主要成分為氫與氦</li><li>大紅斑是大型風暴</li></ul><h2>容易混淆的地方</h2><p>木星並非表面鋪滿陸地的大型地球，而是氣體巨行星。</p><div class="panel"><b>來源與追溯</b><p><a href="../sources/05-jupiter.html">Wiki 來源條目 S05</a> · <a href="https://science.nasa.gov/jupiter/jupiter-facts/" target="_blank" rel="noopener">NASA Science 原始資料</a></p></div></article><footer>此頁由 NASA 來源整理為中文入門摘要，非 NASA 官方翻譯。</footer></main></body></html>
